name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag (for example v1.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
      PICER_DATA_ROOT: ${{ github.workspace }}\.test-data
      PICER_TEST_TEMP: ${{ github.workspace }}\artifacts\test-temp
      VSTEST_CONNECTION_TIMEOUT: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.version || github.ref }}
      - name: Verify existing tag and checked-out commit
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw 'Invalid release tag' }
          $commit = git rev-parse "$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Release requires an existing tag' }
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -ne $head) { throw 'Tag/checkout mismatch' }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore, strict build and non-runtime tests
        shell: pwsh
        run: |
          dotnet restore picer.sln
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }
          dotnet build picer.sln -c Debug --no-restore --warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          dotnet test tests/Picer.Tests/Picer.Tests.csproj -c Debug --no-build --no-restore --filter "Category!=RuntimeComponent" --logger "trx;LogFileName=release-unit.trx" --blame-hang --blame-hang-timeout 10m
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
          dotnet test tests/Picer.E2E/Picer.E2E.csproj -c Debug --no-build --no-restore --filter "Category!=RuntimeComponent" --logger "trx;LogFileName=release-desktop.trx" --blame-hang --blame-hang-timeout 10m
          if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed' }
      - name: Package every component (external runtime distribution)
        shell: pwsh
        run: |
          ./tools/package-release.ps1 -Version $env:RELEASE_TAG -OutputDirectory "$env:RUNNER_TEMP/release-assets"
          if ($LASTEXITCODE -ne 0) { throw 'Package build failed' }
          Copy-Item docs/OFFLINE_INSTALL.md "$env:RUNNER_TEMP/release-assets/OFFLINE-INSTALL.txt"
      - name: Upload binary packages
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            ${{ runner.temp }}/release-assets/*.zip
            ${{ runner.temp }}/release-assets/*.tar.gz
            ${{ runner.temp }}/release-assets/*-setup.exe
            ${{ runner.temp }}/release-assets/*.txt
            ${{ runner.temp }}/release-assets/INSTALL.md
          compression-level: 0
          if-no-files-found: error
      - name: Verify user installer lifecycle and bundled dependencies
        shell: pwsh
        env:
          PICER_LIVE_SERVICE_URL: ${{ secrets.PICER_LIVE_SERVICE_URL }}
          PICER_LIVE_SERVICE_TOKEN: ${{ secrets.PICER_LIVE_SERVICE_TOKEN }}
          PICER_LIVE_SERVICE_SPKI_PIN: ${{ secrets.PICER_LIVE_SERVICE_SPKI_PIN }}
        run: ./tools/verify-user-installers.ps1 -Version $env:RELEASE_TAG -AssetDirectory "$env:RUNNER_TEMP/release-assets" -TestRoot "$env:RUNNER_TEMP/installer-validation" -VerifyLiveService
      - name: Upload installer validation evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: installer-validation
          path: |
            ${{ runner.temp }}/installer-validation/**/*.json
            ${{ runner.temp }}/installer-validation/**/*.log
          if-no-files-found: warn
      - name: Publish draft for final runtime and deployment verification
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem "$env:RUNNER_TEMP/release-assets" -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --title "Picer $env:RELEASE_TAG" --notes-file docs/RELEASE_GUIDE.md --verify-tag --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; inspect existing release before retrying' }
      - name: Cleanup desktop processes
        if: always()
        shell: pwsh
        run: Get-Process Picer.App,testhost,vstest.console -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Upload test evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
