name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      GH_TOKEN: ${{ github.token }}
      PICER_TEST_DATA_ROOT: ${{ github.workspace }}\.test-data

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Invalid release tag: $tag" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "archive=Picer-$tag-win-x64.zip" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download verified offline runtime
        shell: pwsh
        run: |
          gh release download runtime-v1 --repo '${{ github.repository }}' --pattern 'Picer-runtime-win-x64.zip' --dir $env:RUNNER_TEMP
          New-Item -ItemType Directory -Force third_party/runtime | Out-Null
          Expand-Archive "$env:RUNNER_TEMP\Picer-runtime-win-x64.zip" third_party/runtime -Force

      - name: Restore, build and test
        shell: pwsh
        run: |
          dotnet restore picer.sln
          dotnet build picer.sln --configuration Debug --no-restore --warnaserror
          dotnet test tests/Picer.Tests/Picer.Tests.csproj --configuration Debug --no-build --no-restore
          dotnet test tests/Picer.E2E/Picer.E2E.csproj --configuration Debug --no-build --no-restore

      - name: Publish self-contained application
        id: publish
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "Picer-${{ steps.version.outputs.tag }}-win-x64"
          ./tools/publish-self-contained.ps1 -OutputDirectory $output
          $sourceArchive = "$output.zip"
          $releaseArchive = Join-Path $env:RUNNER_TEMP '${{ steps.version.outputs.archive }}'
          Move-Item -LiteralPath $sourceArchive -Destination $releaseArchive
          $hash = (Get-FileHash -LiteralPath $releaseArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ steps.version.outputs.archive }}" | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt')
          "asset=$releaseArchive" >> $env:GITHUB_OUTPUT
          "checksums=$(Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt')" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Picer-${{ steps.version.outputs.tag }}-win-x64
          path: |
            ${{ steps.publish.outputs.asset }}
            ${{ steps.publish.outputs.checksums }}
          compression-level: 0
          retention-days: 14

      - name: Create GitHub Release
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            git tag $tag '${{ github.sha }}'
            git push origin $tag
          }
          gh release create $tag '${{ steps.publish.outputs.asset }}' '${{ steps.publish.outputs.checksums }}' --repo '${{ github.repository }}' --title "Picer $tag" --generate-notes --verify-tag
